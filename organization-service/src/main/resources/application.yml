spring:
  config:
    import: "optional:configserver:http://config-service:8088"
    activate:
      on-profile: docker
---
server:
  port: 0
spring:
  application:
    name: organization-service
  config:
    import: "optional:configserver:http://localhost:8088"
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USER:rabbit}
    password: ${SPRING_RABBITMQ_PASS:password}
  http:
    serviceclient:
      department-service:
        base-url: lb://department-service
      employee-service:
        base-url: lb://employee-service
