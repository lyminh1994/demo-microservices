server:
  port: 8088
spring:
  application:
    name: config-service
  cloud:
    config:
      server:
        git:
          basedir: ${SPRING_CLOUD_CONFIG_SERVER_GIT_BASEDIR}
          uri: ${SPRING_CLOUD_CONFIG_SERVER_GIT_URI}
          default-label: ${SPRING_CLOUD_CONFIG_SERVER_GIT_DEFAULT_LABEL}
          host-key-algorithm: ${SPRING_CLOUD_CONFIG_SERVER_GIT_HOST_KEY_ALGORITHM}
          host-key: ${SPRING_CLOUD_CONFIG_SERVER_GIT_HOST_KEY}
  output:
    ansi:
      enabled: always
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST}
    port: ${SPRING_RABBITMQ_PORT}
    username: ${SPRING_RABBITMQ_USER}
    password: ${SPRING_RABBITMQ_PASS}
encrypt:
  key: ${ENCRYPT_KEY}
logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss}){blue} %clr(${LOG_LEVEL_PATTERN:-%5p}) %m%n"
